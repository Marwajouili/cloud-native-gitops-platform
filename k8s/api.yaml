apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cloudnative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: cloudnative-api:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@db:5432/cloudnative

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudnative
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP