apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Marwajouili/cloud-native-gitops-platform.git
    targetRevision: main
    path: helm/cloudnative

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudnative-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true