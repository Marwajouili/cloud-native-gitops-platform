apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudnative.fullname" . }}-api
  labels:
    {{- include "cloudnative.labels" . | nindent 4 }}
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        {{- include "cloudnative.selectorLabels" . | nindent 8 }}
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@db:5432/{{ .Values.postgres.database }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http