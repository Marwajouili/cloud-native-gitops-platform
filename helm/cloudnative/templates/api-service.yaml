apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudnative.fullname" . }}-api
  labels:
    {{- include "cloudnative.labels" . | nindent 4 }}
    app: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP